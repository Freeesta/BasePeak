name: pages

# Publishes the static site (no build step) to GitHub Pages on every push to main.
# The site root is assembled in SITE_DIR from index.html, capitoli/, pratica/ and assets/ only:
# tests, tools, docs and the (unpublished) chapter editor never leave the repository.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_DIR: _site

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p "$SITE_DIR"
          cp -R index.html capitoli pratica assets "$SITE_DIR"/
          rm -rf "$SITE_DIR/capitoli/src"   # the Markdown sources of the chapters are not part of the site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}
      - id: deployment
        uses: actions/deploy-pages@v4
