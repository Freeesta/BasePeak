<rect class="s" x="612" y="128" width="30" height="64"/>
<text class="t m" x="627" y="232">rivelatore</text>
<circle class="fb" cx="250" cy="152" r="8"/>
<circle class="fa" cx="480" cy="155.2" r="5"/>
<circle class="fb" cx="260" cy="160" r="8"/>
<circle class="fa" cx="486" cy="160" r="5"/>
<circle class="fb" cx="250" cy="168" r="8"/>
<circle class="fa" cx="480" cy="164.8" r="5"/>
<circle class="fb" cx="240" cy="160" r="8"/>
<circle class="fa" cx="474" cy="160" r="5"/>
<path class="rb" d="M300 160L330 160" marker-end="url(#pb)"/>
